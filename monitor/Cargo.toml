[package]
name = "monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.6"

# Chỉ dùng khi chạy test (cargo test): máy chủ HTTP giả, hàm test async.
[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }

[build-dependencies]
tauri-build = "2.7.5"

# Luôn nhúng giao diện (thư mục ui/) vào file .exe, kể cả khi "cargo run" bình thường,
# nên không cần cài thêm tauri-cli hay chạy máy chủ web riêng.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Mức kiểm tra của clippy (cargo clippy): coi mọi cảnh báo là lỗi khi chạy với -D warnings.
[lints.rust]
unsafe_code = "forbid"
