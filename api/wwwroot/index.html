<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công cụ xử lý file</title>
  <style>
    /* Màu sắc đặt một chỗ để dễ đổi. Tự đổi sang nền tối nếu máy người dùng để chế độ tối. */
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #667085;
      --border: #d9dde4;
      --accent: #d92d20;
      --accent-text: #ffffff;
      --ok: #067647;
      --error: #b42318;
      --drop: #fff4f3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b1f27;
        --text: #e6e9ef;
        --muted: #98a2b3;
        --border: #343a46;
        --accent: #f04438;
        --ok: #47cd89;
        --error: #f97066;
        --drop: #2a1d1d;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 28px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .label { font-weight: 600; margin: 0 0 10px; }

    /* Danh sách công cụ */
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tool {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }
    .tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

    /* Ô kéo thả file */
    .drop {
      display: block;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .drop:hover, .drop.dragging { border-color: var(--accent); background: var(--drop); }
    .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .drop small { color: var(--muted); }
    .drop input { display: none; }
    .file-name { margin-top: 12px; font-weight: 600; word-break: break-all; }

    .btn {
      display: inline-block;
      margin-top: 20px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }

    /* Khu vực trạng thái */
    .status { text-align: center; }
    .status p { margin: 8px 0; }
    .status .hint { color: var(--muted); font-size: 14px; }
    .status .ok { color: var(--ok); font-weight: 600; font-size: 18px; }
    .status .error { color: var(--error); font-weight: 600; }
    .spinner {
      width: 36px; height: 36px; margin: 8px auto;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Công cụ xử lý file</h1>
    <p class="subtitle">Chọn công cụ, tải file lên, chờ một chút rồi tải kết quả về.</p>

    <!-- Bước 1: chọn công cụ và file -->
    <section class="card" id="form-view">
      <p class="label">1. Chọn công cụ</p>
      <div class="tools" id="tools"><span class="hint">Đang tải danh sách công cụ...</span></div>

      <p class="label">2. Chọn file</p>
      <label class="drop" id="drop">
        <strong>Kéo thả file vào đây</strong>
        <small>hoặc bấm để chọn file từ máy</small>
        <small id="ext-hint"></small>
        <input type="file" id="file-input">
        <div class="file-name" id="file-name"></div>
      </label>

      <p class="status"><span class="error" id="form-error"></span></p>
      <button class="btn" id="submit" disabled>Bắt đầu xử lý</button>
    </section>

    <!-- Bước 2: theo dõi tiến độ -->
    <section class="card status" id="status-view" hidden>
      <div class="spinner" id="spinner"></div>
      <p id="status-text"></p>
      <p class="hint" id="status-hint"></p>
      <a class="btn" id="download" hidden>Tải file kết quả</a>
      <button class="btn secondary" id="again" hidden>Xử lý file khác</button>
    </section>
  </main>

  <script>
    // ---------- Lấy các phần tử trên trang ----------
    const $ = (id) => document.getElementById(id);
    const toolsBox = $("tools"), drop = $("drop"), fileInput = $("file-input");
    const fileNameBox = $("file-name"), extHint = $("ext-hint"), formError = $("form-error");
    const submitBtn = $("submit"), formView = $("form-view"), statusView = $("status-view");
    const spinner = $("spinner"), statusText = $("status-text"), statusHint = $("status-hint");
    const downloadBtn = $("download"), againBtn = $("again");

    let tools = [];          // danh sách công cụ lấy từ API
    let selectedTool = null; // công cụ đang chọn
    let selectedFile = null; // file đang chọn

    // ---------- Bước 1: tải danh sách công cụ ----------
    async function loadTools() {
      try {
        const res = await fetch("/api/job-types");
        tools = await res.json();
      } catch {
        toolsBox.textContent = "Không kết nối được máy chủ. Thử tải lại trang.";
        return;
      }
      toolsBox.innerHTML = "";
      for (const tool of tools) {
        const btn = document.createElement("button");
        btn.className = "tool";
        btn.type = "button";
        btn.textContent = tool.label;
        btn.setAttribute("aria-pressed", "false");
        btn.onclick = () => selectTool(tool);
        toolsBox.appendChild(btn);
      }
      if (tools.length > 0) selectTool(tools[0]);
    }

    function selectTool(tool) {
      selectedTool = tool;
      [...toolsBox.children].forEach((btn, i) =>
        btn.setAttribute("aria-pressed", String(tools[i] === tool)));
      extHint.textContent = " (nhận file: " + tool.extensions.join(", ") + ")";
      fileInput.accept = tool.extensions.join(",");
      if (selectedFile) checkFile(selectedFile); // kiểm tra lại file đã chọn với công cụ mới
    }

    // ---------- Chọn file (bấm hoặc kéo thả) ----------
    fileInput.onchange = () => { if (fileInput.files[0]) checkFile(fileInput.files[0]); };

    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("dragging"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("dragging");
      if (e.dataTransfer.files[0]) checkFile(e.dataTransfer.files[0]);
    });

    // Kiểm tra đuôi file ngay trên trình duyệt, đỡ phải tải lên rồi mới biết sai.
    // (API vẫn kiểm tra lại lần nữa, vì không được tin hoàn toàn vào trình duyệt.)
    function checkFile(file) {
      selectedFile = file;
      fileNameBox.textContent = file.name; // textContent: hiện tên file như chữ thường, an toàn
      const ext = file.name.includes(".") ? "." + file.name.split(".").pop().toLowerCase() : "";
      if (selectedTool && !selectedTool.extensions.includes(ext)) {
        formError.textContent = "Công cụ này chỉ nhận file: " + selectedTool.extensions.join(", ");
        submitBtn.disabled = true;
      } else {
        formError.textContent = "";
        submitBtn.disabled = !selectedTool;
      }
    }

    // ---------- Bước 2: tải file lên, tạo job ----------
    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      showStatus("Đang tải file lên...", "", true);

      const form = new FormData();
      form.append("type", selectedTool.type);
      form.append("file", selectedFile);

      try {
        const res = await fetch("/api/jobs", { method: "POST", body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Máy chủ báo lỗi (" + res.status + ").");
        watchJob(data.id);
      } catch (err) {
        showError(err.message || "Không tải file lên được.");
      }
    };

    // ---------- Bước 3: hỏi trạng thái mỗi 2 giây ----------
    function watchJob(id) {
      const startedAt = Date.now();

      async function check() {
        let job;
        try {
          const res = await fetch("/api/jobs/" + id);
          job = await res.json();
        } catch {
          setTimeout(check, 2000); // mất mạng thoáng qua: thử lại
          return;
        }

        if (job.status === "Done") {
          showStatus("Xong!", "", false);
          statusText.className = "ok";
          downloadBtn.href = "/api/jobs/" + id + "/output";
          downloadBtn.hidden = false;
          againBtn.hidden = false;
          return;
        }
        if (job.status === "Failed") {
          showError("Xử lý thất bại: " + (job.error || "không rõ lý do"));
          return;
        }

        // Pending hoặc Processing: báo trạng thái rồi hỏi lại sau 2 giây.
        const waited = (Date.now() - startedAt) / 1000;
        if (job.status === "Pending") {
          showStatus("Đang chờ đến lượt...",
            waited > 15 ? "Chờ hơi lâu: có thể máy xử lý đang bận hoặc đang tắt." : "", true);
        } else {
          showStatus("Đang xử lý...", "", true);
        }
        setTimeout(check, 2000);
      }

      check();
    }

    // ---------- Hiển thị ----------
    function showStatus(text, hint, busy) {
      formView.hidden = true;
      statusView.hidden = false;
      statusText.className = "";
      statusText.textContent = text;
      statusHint.textContent = hint;
      spinner.hidden = !busy;
      downloadBtn.hidden = true;
      againBtn.hidden = true;
    }

    function showError(message) {
      showStatus(message, "", false);
      statusText.className = "error";
      againBtn.hidden = false;
    }

    againBtn.onclick = () => {
      selectedFile = null;
      fileInput.value = "";
      fileNameBox.textContent = "";
      formError.textContent = "";
      submitBtn.disabled = true;
      statusView.hidden = true;
      formView.hidden = false;
    };

    loadTools();
  </script>
</body>
</html>
